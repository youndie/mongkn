[versions]
# The shared build conventions. One number: every sborka plugin below takes its version from here.
sborka = "0.1.0.23"
# Kotlin 2.4.10 — последний stable на 2026-08-04 (2.4.20-Beta2 в бете).
# Поддерживаемый диапазон Gradle для KGP 2.4.0-2.4.10: 7.6.3–9.5.0 → wrapper зафиксирован на 9.5.0.
kotlin = "2.4.10"
coroutines = "1.11.0"
serialization = "1.11.0"
# CLI ktlint и Gradle-плагин версионируются независимо: плагин лишь запускает CLI указанной версии.
ktlint = "1.8.0"
ktlintGradle = "14.2.0"
# Официальный JVM-драйвер — эталон для дифференциальных тестов (:mongkn-difftest).
# Источником сигнатур для генерации он быть перестал: решение Р9, генератор удалён.
mongodbDriverKotlin = "5.9.1"

[libraries]
coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
serialization-core = { module = "org.jetbrains.kotlinx:kotlinx-serialization-core", version.ref = "serialization" }
mongodb-driver-kotlin-coroutine = { module = "org.mongodb:mongodb-driver-kotlin-coroutine", version.ref = "mongodbDriverKotlin" }

[plugins]
sborkaKmp = { id = "ru.workinprogress.sborka.kmp", version.ref = "sborka" }
sborkaJvm = { id = "ru.workinprogress.sborka.jvm", version.ref = "sborka" }
sborkaLint = { id = "ru.workinprogress.sborka.lint", version.ref = "sborka" }
sborkaPublish = { id = "ru.workinprogress.sborka.publish", version.ref = "sborka" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlintGradle" }
