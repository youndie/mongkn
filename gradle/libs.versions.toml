[versions]
# The shared build conventions. One number: every sborka plugin below takes its version from here.
# Общие конвенции сборки. Отсюда же приезжает компилятор: релиз sborka публикует каталог `wip`,
# который несёт `kotlin`, — поэтому версии Kotlin в этом файле больше нет и разъезжаться нечему.
sborka = "0.4.0.86"
coroutines = "1.11.0"
serialization = "1.11.0"
# CLI ktlint и Gradle-плагин версионируются независимо: плагин лишь запускает CLI указанной версии.
ktlint = "1.8.0"
ktlintGradle = "14.2.0"
# Официальный JVM-драйвер — эталон для дифференциальных тестов (:mongkn-difftest).
# Источником сигнатур для генерации он быть перестал: решение Р9, генератор удалён.
mongodbDriverKotlin = "5.12.0"

[libraries]
coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
serialization-core = { module = "org.jetbrains.kotlinx:kotlinx-serialization-core", version.ref = "serialization" }
mongodb-driver-kotlin-coroutine = { module = "org.mongodb:mongodb-driver-kotlin-coroutine", version.ref = "mongodbDriverKotlin" }

[plugins]
sborkaKmp = { id = "io.github.youndie.sborka.kmp", version.ref = "sborka" }
sborkaJvm = { id = "io.github.youndie.sborka.jvm", version.ref = "sborka" }
sborkaLint = { id = "io.github.youndie.sborka.lint", version.ref = "sborka" }
sborkaPublish = { id = "io.github.youndie.sborka.publish", version.ref = "sborka" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlintGradle" }
