name: publish

# Публикация в приватный Reposilite. Только вручную: библиотека выкладывается по решению,
# а не на каждый push.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия (пусто — 0.1.<номер прогона>, как у соседних проектов)'
        required: false
        type: string

jobs:
  publish:
    name: linuxX64 → maven
    # Раннер в WSL — **нативный Linux x86_64 с libmongoc 1.26**, то есть ровно та платформа,
    # под которую мы публикуем. Ни контейнера, ни эмуляции: сборка идёт прямо на раннере.
    #
    # Так было не всегда. Первая версия ходила на macOS-раннер и собирала в контейнере
    # `linux/amd64` под QEMU — потому что на macOS-хосте доступна только задача
    # publishMacosArm64…, и наивная публикация выложила бы macosArm64 под координатами mongkn.
    # С появлением раннера в WSL обходной путь стал не нужен.
    runs-on: [self-hosted, Linux, X64, wsl]

    steps:
      - uses: actions/checkout@v4

      - name: Версия
        id: version
        run: |
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then VERSION="0.1.${{ github.run_number }}"; fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Публикуем $VERSION"

      # Артефакт **обязан** быть linuxX64. Собери мы его на macOS-хосте — уехал бы `macosArm64`,
      # и потребитель получил бы «No matching variant» вместо библиотеки. Проверка ниже смотрит
      # на то, что реально опубликовано, а не на зелёный прогон.
      #
      # Тесты здесь не гоняются: им нужен контур из трёх с лишним серверов. Публикуется то,
      # что прогнано отдельно — см. workflow `build`.
      - name: Опубликовать
        env:
          REPOSILITE_USER: ${{ secrets.REPOSILITE_USER }}
          REPOSILITE_SECRET: ${{ secrets.REPOSILITE_SECRET }}
        run: |
          ./gradlew \
            :mongkn-core:publishAllPublicationsToReposilitePrivateRepository \
            :mongkn-extensions:publishAllPublicationsToReposilitePrivateRepository \
            -PVERSION=${{ steps.version.outputs.value }}

      # Успешная публикация говорит только то, что загрузка не упала. Что попало в артефакт,
      # показывает его `.module`: там перечислены варианты, и по ним видно, тот ли это таргет.
      - name: Проверить опубликованное
        env:
          REPOSILITE_USER: ${{ secrets.REPOSILITE_USER }}
          REPOSILITE_SECRET: ${{ secrets.REPOSILITE_SECRET }}
        run: |
          VERSION=${{ steps.version.outputs.value }}
          ROOT=https://maven.internal/private/ru/workinprogress/mongkn
          # Оба модуля, а не только core: extensions публикуется той же версией, и разъехавшиеся
          # версии потребитель увидит как «No matching variant» уже у себя.
          for MODULE_NAME in mongkn-core mongkn-extensions; do
            BASE=$ROOT/$MODULE_NAME/$VERSION
            MODULE=$(curl -fsSL -u "$REPOSILITE_USER:$REPOSILITE_SECRET" "$BASE/$MODULE_NAME-$VERSION.module")
            echo "$MODULE_NAME:"
            echo "$MODULE" | grep -o '"org.jetbrains.kotlin.native.target": "[a-z0-9_]*"' | sort -u
            if ! echo "$MODULE" | grep -q '"org.jetbrains.kotlin.native.target": "linux_x64"'; then
              echo "::error::в $MODULE_NAME нет варианта linux_x64 — артефакт собран не на том хосте"
              exit 1
            fi
            echo "Опубликовано: ru.workinprogress.mongkn:$MODULE_NAME:$VERSION"
          done
