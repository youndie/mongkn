name: publish

# Публикация в Maven-репозиторий. Только вручную: библиотека выкладывается по решению,
# а не на каждый push.
#
# Адрес и учётные данные — в секретах репозитория (MONGKN_REPO_URL / _USER / _SECRET),
# в файлах их нет: у каждого, кто соберёт mongkn, репозиторий свой.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия (пусто — 0.1.<номер прогона>, как у соседних проектов)'
        required: false
        type: string

jobs:
  publish:
    name: linuxX64 → maven
    # Хостовый ubuntu — нативный Linux x86_64, ровно та платформа, под которую мы публикуем.
    #
    # Здесь стоял self-hosted раннер, и для публичного репозитория это было бы дырой: PR
    # из чужого форка исполнял бы свой код на домашней машине. Собирать на macOS-раннере тоже
    # нельзя — там доступна только задача publishMacosArm64…, и наивная публикация выложила бы
    # macosArm64 под координатами mongkn, а потребитель получил бы «No matching variant».
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Драйвер MongoDB
        run: |
          sudo apt-get update
          sudo apt-get install -y libmongoc-dev libbson-dev

      - name: Версия
        id: version
        run: |
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then VERSION="0.1.${{ github.run_number }}"; fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Публикуем $VERSION"

      # Артефакт **обязан** быть linuxX64. Собери мы его на macOS-хосте — уехал бы `macosArm64`,
      # и потребитель получил бы «No matching variant» вместо библиотеки. Проверка ниже смотрит
      # на то, что реально опубликовано, а не на зелёный прогон.
      #
      # Тесты здесь не гоняются: им нужен контур из трёх с лишним серверов. Публикуется то,
      # что прогнано отдельно — см. workflow `build`.
      - name: Опубликовать
        env:
          MONGKN_REPO_URL: ${{ secrets.MONGKN_REPO_URL }}
          MONGKN_REPO_USER: ${{ secrets.MONGKN_REPO_USER }}
          MONGKN_REPO_SECRET: ${{ secrets.MONGKN_REPO_SECRET }}
        run: |
          ./gradlew \
            :mongkn-core:publishAllPublicationsToMongknRepoRepository \
            :mongkn-extensions:publishAllPublicationsToMongknRepoRepository \
            -PVERSION=${{ steps.version.outputs.value }}

      # Успешная публикация говорит только то, что загрузка не упала. Что попало в артефакт,
      # показывает его `.module`: там перечислены варианты, и по ним видно, тот ли это таргет.
      - name: Проверить опубликованное
        env:
          MONGKN_REPO_URL: ${{ secrets.MONGKN_REPO_URL }}
          MONGKN_REPO_USER: ${{ secrets.MONGKN_REPO_USER }}
          MONGKN_REPO_SECRET: ${{ secrets.MONGKN_REPO_SECRET }}
        run: |
          VERSION=${{ steps.version.outputs.value }}
          ROOT="$MONGKN_REPO_URL/io/github/youndie/mongkn"
          # Оба модуля, а не только core: extensions публикуется той же версией, и разъехавшиеся
          # версии потребитель увидит как «No matching variant» уже у себя.
          for MODULE_NAME in mongkn-core mongkn-extensions; do
            BASE=$ROOT/$MODULE_NAME/$VERSION
            MODULE=$(curl -fsSL -u "$MONGKN_REPO_USER:$MONGKN_REPO_SECRET" "$BASE/$MODULE_NAME-$VERSION.module")
            echo "$MODULE_NAME:"
            echo "$MODULE" | grep -o '"org.jetbrains.kotlin.native.target": "[a-z0-9_]*"' | sort -u
            if ! echo "$MODULE" | grep -q '"org.jetbrains.kotlin.native.target": "linux_x64"'; then
              echo "::error::в $MODULE_NAME нет варианта linux_x64 — артефакт собран не на том хосте"
              exit 1
            fi
            echo "Опубликовано: io.github.youndie.mongkn:$MODULE_NAME:$VERSION"
          done
