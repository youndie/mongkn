name: publish

# Publishing to a Maven repository. Manual only: the library goes out by decision, not on every push.
#
# The address and the credentials live in repository secrets (MONGKN_REPO_URL / _USER / _SECRET),
# never in files: whoever builds mongkn publishes to their own repository.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (empty — 0.1.<run number>)'
        required: false
        type: string

jobs:
  publish:
    name: linuxX64 → maven
    # A hosted ubuntu is a native Linux x86_64 — exactly the platform we publish for.
    #
    # A self-hosted runner used to stand here, and on a public repository that would be a hole:
    # a pull request from someone else's fork would execute its own code on a home machine.
    # Building on a macOS runner is not an option either — only the publishMacosArm64… task is
    # available there, and a naive publish would push macosArm64 under mongkn's coordinates,
    # leaving the consumer with "No matching variant" instead of a library.
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      # There was no Java setup in this job at all: it ran on whatever JDK the runner image happened
      # to carry. That worked, and "worked" is the whole objection — the toolchain this build asks
      # for is a decision (`sborka.jvmToolchain`), and leaving the JDK to the image means the day the
      # image changes, the publish is the thing that finds out.
      - uses: youndie/sborka/.github/actions/setup-kotlin@main
        with:
          konan-cache: "true"

      - name: MongoDB C driver
        run: |
          sudo apt-get update
          sudo apt-get install -y libmongoc-dev libbson-dev

      - name: Version
        id: version
        run: |
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then VERSION="0.1.${{ github.run_number }}"; fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing $VERSION"

      # The artefact **must** be linuxX64. Built on a macOS host it would be macosArm64, and the
      # consumer would get "No matching variant" instead of a library. The check below looks at
      # what was actually published rather than at a green run.
      #
      # Tests do not run here: they need a contour of four servers. What gets published is what was
      # tested separately — see the `build` workflow.
      - name: Publish
        # The ORG_GRADLE_PROJECT_ prefix turns an environment variable into a Gradle **project
        # property**, which is what `providers.gradleProperty(…)` reads. Plain environment
        # variables work too through the fallback, but properties are the mechanism Gradle
        # documents, and they survive the configuration cache without special handling.
        env:
          # The SAME SECRETS under the names the shared convention reads. `sborka.publish` declares
          # the repository itself, as `wip`, and takes its credentials from REPOSILITE_USER /
          # REPOSILITE_SECRET — so the values do not move, only what they are called on the way in.
          ORG_GRADLE_PROJECT_REPOSILITE_USER: ${{ secrets.MONGKN_REPO_USER }}
          ORG_GRADLE_PROJECT_REPOSILITE_SECRET: ${{ secrets.MONGKN_REPO_SECRET }}
        run: |
          ./gradlew \
            :mongkn-core:publishAllPublicationsToWipRepository \
            :mongkn-extensions:publishAllPublicationsToWipRepository \
            -PVERSION=${{ steps.version.outputs.value }}

      # A successful publish only says the upload did not fail. What ended up in the artefact is
      # visible in its `.module`: the variants are listed there, and they show whether this is the
      # right target.
      - name: Verify what was published
        env:
          MONGKN_REPO_URL: ${{ secrets.MONGKN_REPO_URL }}
          MONGKN_REPO_USER: ${{ secrets.MONGKN_REPO_USER }}
          MONGKN_REPO_SECRET: ${{ secrets.MONGKN_REPO_SECRET }}
        run: |
          VERSION=${{ steps.version.outputs.value }}
          # The same default as in publishing.gradle.kts: the URL secret is optional, and without
          # this the step died with curl's "malformed URL" while the publish itself had succeeded.
          ROOT="${MONGKN_REPO_URL:-https://reposilite.kotlin.website/snapshots}/io/github/youndie/mongkn"
          # Both modules, not just core: extensions is published with the same version, and versions
          # drifting apart show up as "No matching variant" on the consumer's side, not here.
          for MODULE_NAME in mongkn-core mongkn-extensions; do
            BASE=$ROOT/$MODULE_NAME/$VERSION
            MODULE=$(curl -fsSL -u "$MONGKN_REPO_USER:$MONGKN_REPO_SECRET" "$BASE/$MODULE_NAME-$VERSION.module")
            echo "$MODULE_NAME:"
            echo "$MODULE" | grep -o '"org.jetbrains.kotlin.native.target": "[a-z0-9_]*"' | sort -u
            if ! echo "$MODULE" | grep -q '"org.jetbrains.kotlin.native.target": "linux_x64"'; then
              echo "::error::$MODULE_NAME has no linux_x64 variant — built on the wrong host"
              exit 1
            fi
            echo "Published: io.github.youndie.mongkn:$MODULE_NAME:$VERSION"
          done
