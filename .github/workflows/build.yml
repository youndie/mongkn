name: build

# Матрица из двух хостов — не для галочки. На macOS Homebrew даёт mongo-c-driver 2.x,
# на Ubuntu apt даёт 1.26, то есть ветку 1.x. Обе ветки резолвера библиотек проверяются
# по-настоящему, а не на честном слове (решение Р1 ресёрча).
#
# Kotlin/Native не поддерживает linux-aarch64 как хост, поэтому Linux-раннер обязан быть
# x86_64 — см. §1.18 ресёрча.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macosArm64 (mongo-c-driver 2.x)
            runner: macos-14
          - name: linuxX64 (libmongoc 1.x)
            runner: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Установить mongo-c-driver (macOS, ветка 2.x)
        if: runner.os == 'macOS'
        run: brew install mongo-c-driver

      - name: Установить libmongoc (Linux, ветка 1.x)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libmongoc-dev libbson-dev

      # Сервер поднимается как **одноузловой replica set**, а не standalone. Причина одна:
      # change streams на standalone не работают вовсе, то есть тесты `watch` без этого нечем
      # проверить. Для всех остальных операций одноузловой replica set неотличим от standalone,
      # а вдобавок он понадобится транзакциям (M14) и readPreference (M-50).
      #
      # `rs.initiate` задаёт член явным адресом `127.0.0.1:27017`: без этого сервер объявит себя
      # под своим hostname, драйвер пойдёт по объявленному адресу и не достучится.
      - name: Поднять mongod (Linux)
        if: runner.os == 'Linux'
        run: |
          docker run -d --name mongod -p 27017:27017 mongo:8 --replSet rs0 --bind_ip_all --setParameter enableTestCommands=1
          for _ in $(seq 1 30); do docker exec mongod mongosh --quiet --eval 'db.runCommand({ping:1})' >/dev/null 2>&1 && break; sleep 2; done
          docker exec mongod mongosh --quiet --eval "rs.initiate({_id:'rs0',members:[{_id:0,host:'127.0.0.1:27017'}]})"
          for _ in $(seq 1 30); do docker exec mongod mongosh --quiet --eval 'quit(db.hello().isWritablePrimary ? 0 : 1)' && break; sleep 2; done

      - name: Поднять mongod (macOS)
        if: runner.os == 'macOS'
        run: |
          brew tap mongodb/brew
          # mongosh отдельной формулой: он нужен для rs.initiate, а с сервером не ставится.
          brew install mongodb-community@8.0 mongosh
          # enableTestCommands нужен failpoint'ам в RetryTest: без него сервер откажется
          # инсценировать сбой, и проверить ретраи будет нечем.
          printf 'replication:\n  replSetName: rs0\nsetParameter:\n  enableTestCommands: 1\n' >> "$(brew --prefix)/etc/mongod.conf"
          brew services start mongodb-community@8.0
          # Сервер поднимается не мгновенно, а тесты падают, а не пропускаются, если его нет.
          for _ in $(seq 1 30); do nc -z 127.0.0.1 27017 && break; sleep 2; done
          mongosh --quiet --eval "rs.initiate({_id:'rs0',members:[{_id:0,host:'127.0.0.1:27017'}]})"
          for _ in $(seq 1 30); do mongosh --quiet --eval 'quit(db.hello().isWritablePrimary ? 0 : 1)' && break; sleep 2; done

      # Второй сервер — с включённой аутентификацией, на своём порту. Отдельный, а не тот же
      # самый: включи мы --auth на основном, креды понадобились бы каждому из полутора сотен
      # остальных тестов, и предмет проверки растворился бы в общем шуме. Креды здесь —
      # фикстура одноразового контейнера, а не секрет.
      - name: Поднять mongod с аутентификацией (Linux)
        if: runner.os == 'Linux'
        run: |
          docker run -d --name mongod-auth -p 27019:27017 \
            -e MONGO_INITDB_ROOT_USERNAME=mongkn_test -e MONGO_INITDB_ROOT_PASSWORD=mongkn_secret mongo:8
          for _ in $(seq 1 30); do docker exec mongod-auth mongosh --quiet -u mongkn_test -p mongkn_secret --authenticationDatabase admin --eval 'db.runCommand({ping:1})' >/dev/null 2>&1 && break; sleep 2; done
          docker exec mongod-auth mongosh --quiet -u mongkn_test -p mongkn_secret --authenticationDatabase admin \
            --eval 'db.getSiblingDB("admin").createUser({user:"mongkn_odd", pwd:"p@ss:w/rd?#1", roles:[{role:"root", db:"admin"}]})'

      # На macOS docker недоступен, поэтому второй mongod поднимается напрямую. Пользователи
      # заводятся до включения --auth и сервер перезапускается: localhost-исключение на свежем
      # сервере срабатывает не всегда, а этот порядок детерминирован.
      - name: Поднять mongod с аутентификацией (macOS)
        if: runner.os == 'macOS'
        run: |
          BIN="$(brew --prefix)/opt/mongodb-community@8.0/bin"
          mkdir -p /tmp/mongo-auth
          "$BIN/mongod" --port 27019 --dbpath /tmp/mongo-auth --fork --logpath /tmp/mongod-auth.log
          for _ in $(seq 1 30); do nc -z 127.0.0.1 27019 && break; sleep 2; done
          mongosh --quiet --port 27019 --eval 'db.getSiblingDB("admin").createUser({user:"mongkn_test", pwd:"mongkn_secret", roles:[{role:"root", db:"admin"}]}); db.getSiblingDB("admin").createUser({user:"mongkn_odd", pwd:"p@ss:w/rd?#1", roles:[{role:"root", db:"admin"}]})'
          "$BIN/mongod" --port 27019 --dbpath /tmp/mongo-auth --shutdown
          "$BIN/mongod" --port 27019 --dbpath /tmp/mongo-auth --auth --fork --logpath /tmp/mongod-auth.log
          for _ in $(seq 1 30); do nc -z 127.0.0.1 27019 && break; sleep 2; done

      - uses: gradle/actions/setup-gradle@v4

      - name: Сборка и тесты
        # checkKotlinAbi выполняется только на macOS: дамп различается между таргетами строкой
        # `// Targets:`, а объявления одинаковы (§1.19). На Linux задача пропускается сама.
        run: ./gradlew build --stacktrace

      - name: Отчёты тестов
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.runner }}
          path: '**/build/test-results/**/*.xml'
          if-no-files-found: warn
