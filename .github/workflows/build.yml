name: build

# The two-host matrix is not decoration. Homebrew on macOS gives mongo-c-driver 2.x, apt on Ubuntu
# gives 1.26 — that is the 1.x branch. Both branches of the library resolver are therefore exercised
# for real rather than taken on trust (decision Р1 in docs/research/research-architecture.md).
#
# Kotlin/Native does not support linux-aarch64 as a host, so the Linux runner must be x86_64 —
# see §1.18 of the research document.

# **Automatic triggers are switched off for now.** Only the manual one (`workflow_dispatch`) is
# left: the sharded contour from M-66 has never run in CI, and the first thing to trip over it will
# be the macOS job, where the cluster is started as brew processes rather than a container. Better
# a deliberate first run than a broken check on the next push.
#
# To bring them back, uncomment `push` and `pull_request` below.
on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  # pull_request:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macosArm64 (mongo-c-driver 2.x)
            runner: macos-14
          - name: linuxX64 (libmongoc 1.x)
            runner: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install mongo-c-driver (macOS, 2.x branch)
        if: runner.os == 'macOS'
        run: brew install mongo-c-driver

      - name: Install libmongoc (Linux, 1.x branch)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libmongoc-dev libbson-dev

      # The server comes up as a **single-node replica set**, not a standalone. One reason: change
      # streams do not work on a standalone at all, so there would be nothing to test `watch`
      # against. For every other operation a single-node replica set is indistinguishable from a
      # standalone, and transactions (M14) and readPreference (M-50) will need it anyway.
      #
      # `rs.initiate` names the member by its explicit address `127.0.0.1:27017`: without that the
      # server advertises its own hostname, the driver follows the advertised address and never
      # arrives.
      - name: Start mongod (Linux)
        if: runner.os == 'Linux'
        run: |
          docker run -d --name mongod -p 27017:27017 mongo:8 --replSet rs0 --bind_ip_all --setParameter enableTestCommands=1
          for _ in $(seq 1 30); do docker exec mongod mongosh --quiet --eval 'db.runCommand({ping:1})' >/dev/null 2>&1 && break; sleep 2; done
          docker exec mongod mongosh --quiet --eval "rs.initiate({_id:'rs0',members:[{_id:0,host:'127.0.0.1:27017'}]})"
          for _ in $(seq 1 30); do docker exec mongod mongosh --quiet --eval 'quit(db.hello().isWritablePrimary ? 0 : 1)' && break; sleep 2; done

      - name: Start mongod (macOS)
        if: runner.os == 'macOS'
        run: |
          brew tap mongodb/brew
          # Homebrew refuses to load formulae from a third-party tap until the tap is trusted —
          # a security measure added in Homebrew 6. Without this line the step fails at install
          # with "Refusing to load formula … from untrusted tap", and no amount of retrying helps.
          # The whole tap is trusted rather than each formula: both the server and mongosh live here.
          brew trust --tap mongodb/brew
          # mongosh is a separate formula: rs.initiate needs it, and it does not come with the server.
          brew install mongodb-community@8.0 mongosh
          # enableTestCommands is required by the failpoints in RetryTest: without it the server
          # refuses to stage a failure, and there is nothing to test retries against.
          printf 'replication:\n  replSetName: rs0\nsetParameter:\n  enableTestCommands: 1\n' >> "$(brew --prefix)/etc/mongod.conf"
          brew services start mongodb-community@8.0
          # The server does not come up instantly, and the tests fail rather than skip without it.
          for _ in $(seq 1 30); do nc -z 127.0.0.1 27017 && break; sleep 2; done
          mongosh --quiet --eval "rs.initiate({_id:'rs0',members:[{_id:0,host:'127.0.0.1:27017'}]})"
          for _ in $(seq 1 30); do mongosh --quiet --eval 'quit(db.hello().isWritablePrimary ? 0 : 1)' && break; sleep 2; done

      # The second server has authentication enabled, on its own port. Separate rather than the same
      # one: had we enabled --auth on the main server, every one of the other hundred and fifty tests
      # would need credentials, and the subject of the check would dissolve into noise. The
      # credentials here are a fixture of a throwaway container, not a secret.
      - name: Start mongod with authentication (Linux)
        if: runner.os == 'Linux'
        run: |
          docker run -d --name mongod-auth -p 27019:27017 \
            -e MONGO_INITDB_ROOT_USERNAME=mongkn_test -e MONGO_INITDB_ROOT_PASSWORD=mongkn_secret mongo:8
          for _ in $(seq 1 30); do docker exec mongod-auth mongosh --quiet -u mongkn_test -p mongkn_secret --authenticationDatabase admin --eval 'db.runCommand({ping:1})' >/dev/null 2>&1 && break; sleep 2; done
          docker exec mongod-auth mongosh --quiet -u mongkn_test -p mongkn_secret --authenticationDatabase admin \
            --eval 'db.getSiblingDB("admin").createUser({user:"mongkn_odd", pwd:"p@ss:w/rd?#1", roles:[{role:"root", db:"admin"}]})'

      # Docker is not available on macOS, so the second mongod is started directly. Users are created
      # before --auth is switched on and the server is restarted: the localhost exception on a fresh
      # server does not always apply, whereas this order is deterministic.
      - name: Start mongod with authentication (macOS)
        if: runner.os == 'macOS'
        run: |
          BIN="$(brew --prefix)/opt/mongodb-community@8.0/bin"
          mkdir -p /tmp/mongo-auth
          "$BIN/mongod" --port 27019 --dbpath /tmp/mongo-auth --fork --logpath /tmp/mongod-auth.log
          for _ in $(seq 1 30); do nc -z 127.0.0.1 27019 && break; sleep 2; done
          mongosh --quiet --port 27019 --eval 'db.getSiblingDB("admin").createUser({user:"mongkn_test", pwd:"mongkn_secret", roles:[{role:"root", db:"admin"}]}); db.getSiblingDB("admin").createUser({user:"mongkn_odd", pwd:"p@ss:w/rd?#1", roles:[{role:"root", db:"admin"}]})'
          "$BIN/mongod" --port 27019 --dbpath /tmp/mongo-auth --shutdown
          "$BIN/mongod" --port 27019 --dbpath /tmp/mongo-auth --auth --fork --logpath /tmp/mongod-auth.log
          for _ in $(seq 1 30); do nc -z 127.0.0.1 27019 && break; sleep 2; done

      # The third server requires TLS. Certificates are generated rather than kept in the repository:
      # the server certificate lives 397 days (Apple's policy — Secure Transport on macOS rejects
      # anything longer), so a committed set would break the build a year later without a single
      # code change.
      - name: Start mongod with TLS
        run: |
          ./ci/tls/generate.sh "$PWD/build/tls"
          ./ci/tls/start-server.sh mongod-tls "$PWD/build/tls" -p 27020:27017
          # Locally the same servers come up with a single `ci/dev-servers.sh up` (docker compose
          # plus initialisation). In CI the steps are kept separate: docker is unavailable on the
          # macOS runner, and mongod is installed there through brew.

      # The fourth contour is a sharded cluster (M-66): a config replica set, two shards and a
      # mongos. The port layout is identical for the container and for bare processes on macOS, so
      # one script starts the cluster and another — shared by both — brings it to a working state.
      # The only difference is how to call mongosh, and that is exactly one variable.
      - name: Start the sharded cluster (Linux)
        if: runner.os == 'Linux'
        env:
          MONGKN_PLATFORM: linux/amd64
        run: |
          docker compose up -d mongo-shard
          MONGKN_SHARD_EXEC="docker exec mongkn-shard" ./ci/shard/init.sh

      - name: Start the sharded cluster (macOS)
        if: runner.os == 'macOS'
        run: |
          # brew does not put mongod and mongos on PATH, and the script calls them by name: it is
          # written for the container too, where they live in system directories.
          export PATH="$(brew --prefix)/opt/mongodb-community@8.0/bin:$PATH"
          MONGKN_SHARD_DBROOT=/tmp/mongkn-shard ./ci/shard/start.sh
          ./ci/shard/init.sh

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        # checkKotlinAbi runs on macOS only: the dump differs between targets by the `// Targets:`
        # line while the declarations are identical (§1.19). On Linux the task skips itself.
        run: ./gradlew build --stacktrace

      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.runner }}
          path: '**/build/test-results/**/*.xml'
          if-no-files-found: warn
