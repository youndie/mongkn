# Тестовые серверы mongkn — все четыре одной командой.
#
# Их именно четыре, и каждый нужен по своей причине, которую нельзя закрыть настройкой соседа:
#
# * `mongo` — одноузловой **replica set**. Без него не работают change streams и транзакции;
# * `mongo-auth` — с `--auth`. Включи мы аутентификацию на первом, креды понадобились бы всем
#   двум сотням остальных тестов, и `AuthenticationTest` проверял бы общий фон, а не предмет;
# * `mongo-tls` — с `--tlsMode requireTLS`. Он отвергает любое нешифрованное соединение,
#   то есть на общем сервере переписал бы подключение во всех тестах ради одного набора;
# * `mongo-shard` — **шардированный кластер** (M-66). Единственная топология, в которой
#   `readPreference` наблюдаем помимо выбора сервера, и единственная, где есть что сливать
#   из нескольких источников. Внутри контейнера четыре процесса — почему так, см. ci/shard/start.sh.
#
# Раньше их было шесть: те же три плюс копии в docker-сети для Linux-прогона. Копии убраны —
# контейнер сборки ходит на хост через `host.docker.internal`, см. CLAUDE.md.
#
# Порты и имена контейнеров **разводятся**: на одной машине может жить и контур разработчика,
# и контур прогона CI (self-hosted раннер в WSL стоит там же, где работают руками). Значения
# по умолчанию — те же, что были, поэтому обычный `ci/dev-servers.sh up` ничего не меняет.
# Сдвиг задаётся через MONGKN_PORT_OFFSET, см. ci/dev-servers.sh.
#
# Порт сдвигается **и внутри контейнера**, а публикуется один в один. Иначе реплика-сет объявляет
# себя портом, на котором внутри никто не слушает: адрес члена обязан быть одним и тем же
# с обеих сторон. Первая версия сдвигала только публикуемый порт — сдвинутый контур объявлял
# себя адресом соседнего, и тесты уходили в чужие серверы.
#
# Память ограничена намеренно. WiredTiger по умолчанию забирает половину ОЗУ машины минус
# гигабайт, то есть на 16-гигабайтном ноутбуке каждый из трёх серверов счёл бы себя вправе
# занять несколько гигабайт. Для тестовых объёмов хватает четверти гигабайта — это минимум,
# который принимает сам WiredTiger. Итог замерен, а не оценён: три одиночных сервера около
# 400 МБ, шардированный кластер — 410 МБ сразу после старта и около 530 МБ после полного
# прогона тестов, при лимите в гигабайт.

x-common: &common
  image: mongo:8
  restart: unless-stopped
  # Под архитектуру хоста: образ не той архитектуры уедет в эмуляцию QEMU, прогон станет вдвое
  # дольше, а замеры производительности — бессмысленными. Проверять так:
  # docker image inspect mongo:8 --format '{{.Architecture}}'
  #
  # Умолчание — arm64 (машина автора). **На x86-хосте, включая WSL2, задайте
  # MONGKN_PLATFORM=linux/amd64**, иначе получите ту самую эмуляцию.
  platform: ${MONGKN_PLATFORM:-linux/arm64}
  mem_limit: 512m
  # Данные лежат на диске, а не в tmpfs, хотя пережить перезапуск им незачем. Две причины,
  # обе выяснились прогоном: tmpfs считается в память контейнера и добавлял к каждому серверу
  # больше сотни мегабайт — ровно то, чего мы избегаем; а mongod отказывается строить индексы,
  # если свободного места меньше 500 МБ, и на размере tmpfs под лимит памяти это условие
  # не выполнить. `ci/dev-servers.sh down` убирает тома вместе с контейнерами.

services:
  # Одноузловой replica set. Адрес члена задаётся явно (`127.0.0.1`) скриптом инициализации:
  # иначе сервер объявит себя под своим hostname, и драйвер уйдёт по недостижимому адресу.
  mongo:
    <<: *common
    container_name: ${MONGKN_PREFIX:-mongkn}-it
    ports: ["${MONGKN_PORT_RS:-27017}:${MONGKN_PORT_RS:-27017}"]
    command: >
      mongod --replSet rs0 --bind_ip_all
      --port ${MONGKN_PORT_RS:-27017}
      --wiredTigerCacheSizeGB 0.25
      --setParameter enableTestCommands=1

  # SCRAM. Пользователь заводится штатным механизмом образа, а второй — с паролем
  # из значащих для URI символов — скриптом инициализации.
  mongo-auth:
    <<: *common
    container_name: ${MONGKN_PREFIX:-mongkn}-auth
    ports: ["${MONGKN_PORT_AUTH:-27019}:${MONGKN_PORT_AUTH:-27019}"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongkn_test
      MONGO_INITDB_ROOT_PASSWORD: mongkn_secret
    command: >
      mongod --bind_ip_all
      --port ${MONGKN_PORT_AUTH:-27019}
      --wiredTigerCacheSizeGB 0.25
      --setParameter enableTestCommands=1

  # TLS. Сертификаты монтируются только для чтения и копируются внутрь: `docker cp` и монтирование
  # кладут файлы от root, а mongod не станет читать чужой ключ. Копия делается в точке входа,
  # потому что compose не умеет менять владельца смонтированного файла.
  #
  # `--tlsAllowConnectionsWithoutCertificates` обязателен: одно только `--tlsCAFile` делает
  # клиентский сертификат обязательным, и обычное TLS-подключение сервер молча закрывает.
  mongo-tls:
    <<: *common
    container_name: ${MONGKN_PREFIX:-mongkn}-tls
    ports: ["${MONGKN_PORT_TLS:-27020}:${MONGKN_PORT_TLS:-27020}"]
    volumes:
      - ./build/tls:/tls:ro
    entrypoint: ["sh", "-c"]
    command:
      - >
        mkdir -p /etc/mongo-tls
        && cp /tls/server.pem /tls/ca.pem /etc/mongo-tls/
        && chown -R mongodb:mongodb /etc/mongo-tls
        && chmod 400 /etc/mongo-tls/*
        && exec docker-entrypoint.sh mongod --bind_ip_all
        --port ${MONGKN_PORT_TLS:-27020}
        --tlsMode requireTLS
        --tlsCertificateKeyFile /etc/mongo-tls/server.pem
        --tlsCAFile /etc/mongo-tls/ca.pem
        --tlsAllowConnectionsWithoutCertificates
        --wiredTigerCacheSizeGB 0.25
        --setParameter enableTestCommands=1

  # Шардированный кластер: конфигурационный реплика-сет, два шарда и mongos — четыре процесса
  # в одном контейнере. Скрипт монтируется, а не копируется в образ: тот же файл запускает
  # кластер и на машине без docker (macOS-раннер в CI), и второго места для правки быть не должно.
  #
  # Наружу опубликована только mongos: шарды и конфигурация драйверу не адресуются никогда,
  # поэтому и портов у них на хосте нет. Лимит памяти один на весь кластер — это и есть
  # честный ответ на вопрос, сколько контур стоит.
  mongo-shard:
    <<: *common
    container_name: ${MONGKN_PREFIX:-mongkn}-shard
    # Наружу выходит только mongos: конфигурационный набор и шарды живут внутри контейнера
    # и хостовых портов не занимают.
    ports: ["${MONGKN_PORT_MONGOS:-27021}:${MONGKN_PORT_MONGOS:-27021}"]
    mem_limit: 1g
    volumes:
      - ./ci/shard:/shard:ro
    environment:
      MONGKN_SHARD_FOREGROUND: "1"
      # Сдвиг уезжает внутрь: ci/shard/start.sh поднимает все четыре процесса на сдвинутых
      # портах, и адреса членов совпадают с публикуемыми.
      MONGKN_PORT_OFFSET: ${MONGKN_PORT_OFFSET:-0}
    entrypoint: ["bash", "/shard/start.sh"]
