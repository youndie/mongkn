# THERE WAS NO gradle.properties HERE AT ALL, which meant no build cache, no configuration cache and
# no parallel execution — three defaults that cost time on every run and that nobody had chosen.
org.gradle.caching=true
org.gradle.parallel=true

# CONFIGURATION CACHE IS OFF, and that is a finding rather than a preference. Three tasks here
# capture Gradle script object references, which it cannot serialise:
# `:mongkn-core:fetchSpecTests`, `:mongkn-difftest:seedDiffReference` and `:verifyDiffWritten`.
# Fixing them means moving their bodies out of the build scripts and into classes with declared
# inputs — a change to this repository's test harness rather than to how it is built, and one that
# belongs in its own pull request. Tracked: youndie/mongkn#3.
# org.gradle.configuration-cache=true
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8

kotlin.code.style=official

# A default that is a snapshot on purpose: a build with no -PVERSION must not be able to produce
# something that looks like a release.
version=0.1.0-SNAPSHOT

# WHAT THIS REPOSITORY TELLS THE SHARED CONVENTIONS.
sborka.group=io.github.youndie.mongkn
sborka.repository=youndie/mongkn
sborka.description=MongoDB for Kotlin/Native: a wrapper over the official C driver with an API shaped after mongodb-driver-kotlin-coroutine.
sborka.inceptionYear=2026
sborka.licence=The Apache License, Version 2.0

# 21 for both. The published modules are Kotlin/Native and carry no jvm variant at all, so the floor
# reaches only `:mongkn-difftest` — which is test scaffolding and is never published. Set anyway: the
# day a jvm target appears, the number it advertises should be a decision rather than whatever JDK
# the build machine had.
sborka.jvmToolchain=21
sborka.jvmFloor=21
